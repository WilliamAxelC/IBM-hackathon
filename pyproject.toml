[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kevgate"
version = "0.1.0"
description = "Universal System-1 Decision Layer & Pre-Commit Gate for Agentic Coding Harnesses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "typer[all]>=0.12",
    "mcp>=1.0",
    "python-dotenv>=1.0",
]

[project.scripts]
s1gate = "kevgate.cli:app"
kevgate = "kevgate.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio[trio]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kevgate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "src/kevgate/benchmarks"]

[tool.hatch.metadata]
allow-direct-references = true
